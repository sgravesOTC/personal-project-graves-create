{% extends "newshroom/base.html" %}
{% block title %}Delete {{ specimen.title }}{% endblock %}

{% block content %}
  <h1>Delete {{ specimen.title }}?</h1>

  <img
    src="{{ specimen.image.url }}"
    class="mushroom-photo"
    alt="{{ specimen.title }}"
  />

  <p>Are you sure you want to delete this specimen? This cannot be undone.</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn-danger">Yes, delete it</button>
    <a href="{{ specimen.get_absolute_url }}" class="btn-back">Cancel</a>
  </form>
{% endblock %}
