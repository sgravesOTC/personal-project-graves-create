{% extends "newshroom/base.html" %}
{% block title %}Add a Specimen{% endblock %}

{% block content %}
  <h1>Add a Specimen</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-send">Save to Field Notes</button>
  </form>
{% endblock %}
