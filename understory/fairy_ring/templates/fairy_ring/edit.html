{% extends "newshroom/base.html" %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
    <h1>Edit Profile</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <h2>Your Info</h2>
        {{ user_form.as_p }}
        <h2>Your Profile</h2>
        {{ profile_form.as_p }}
        <button type="submit">Save Changes</button>
    </form>
{% endblock content %}
