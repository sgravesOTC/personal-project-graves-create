{% extends "base.html" %}

{% block title %}Welcome – The Nest{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center text-center">
        <div class="col-md-7">
            <h1 class="display-4 mb-3">Welcome to The Nest</h1>
            <p class="lead text-muted mb-5">A place to connect, track, and grow together.</p>

            {% if user.is_authenticated %}
                <a href="/dashboard/" class="btn btn-primary btn-lg">Go to Dashboard</a>
            {% else %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'account:login' %}" class="btn btn-primary btn-lg">Log In</a>
                    <a href="{% url 'account:register' %}" class="btn btn-outline-primary btn-lg">Create Account</a>
                </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
