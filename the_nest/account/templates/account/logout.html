{% extends "base.html" %}

{% block title %}Log Out – The Nest{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm text-center">
                <div class="card-body p-4">
                    <h2 class="card-title mb-3">Log Out</h2>
                    <p class="text-muted mb-4">Are you sure you want to log out?</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-primary w-100">Log Out</button>
                    </form>
                    <a href="{% url 'register' %}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
